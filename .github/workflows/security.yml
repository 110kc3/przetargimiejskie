# Security release gate (~3-4 min/run). Three independent jobs; scanner results
# are uploaded to the Security tab and medium-or-higher dependency findings now
# block the run. CodeQL alerts on main are checked after analysis so a green
# workflow cannot coexist with an untriaged main-branch finding.
#
#   - Hosted-runner policy: rejects workflow jobs that depend on a
#     repository-managed runner, where an offline machine can strand scheduled
#     refresh jobs indefinitely.
#   - CodeQL (javascript): the project's real risk class is crawled municipal
#     content flowing into innerHTML / hrefs across the extension, popup and
#     site (the exact bug family hand-fixed in v1.14.3 and re-hardened in
#     v1.20.1). JS needs no build step. Free for public repos.
#   - Trivy fs: lockfile CVEs (the playwright chain is the only dependency) +
#     secret scanning over the whole tree (data/ and the crawl caches get
#     committed — cheap insurance against an accidentally committed token).
#
# All third-party actions are pinned to a full commit SHA (with the human tag
# in a trailing comment) so a moved tag can't silently change what runs — this
# repo's trusted data publishers hold `contents: write`, so supply-chain hygiene
# matters even though the source-facing crawler jobs are read-only.
name: 6. Security

on:
  push:
    branches: [main]
  # Run on stacked PRs too; otherwise a security-sensitive follow-up does not
  # receive CodeQL/Trivy until its base branch lands on main.
  pull_request:
  schedule:
    - cron: '0 7 * * 1'   # Mondays 07:00 UTC (an hour after the data refresh)
  workflow_dispatch: {}

# Default to read-only; each job widens to exactly what it needs.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-runner-policy:
    name: Hosted runner policy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Reject workflow jobs that require repository-managed runners
        run: node pipeline/scripts/check-workflow-runners.js

  codeql:
    name: CodeQL (javascript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # upload the analysis SARIF
      actions: read            # required for private repos; harmless on public
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@8272c299f21ca24af15dfe9ac0971ba969e5e0d5 # v3.36.2
        with:
          languages: javascript
      - name: Analyze
        uses: github/codeql-action/analyze@8272c299f21ca24af15dfe9ac0971ba969e5e0d5 # v3.36.2
        with:
          category: '/language:javascript'

      - name: Require zero open CodeQL alerts on main
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # SARIF processing is asynchronous. Retry briefly before deciding the
          # main-branch baseline is dirty.
          for attempt in 1 2 3; do
            count=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&ref=refs/heads/main&tool_name=CodeQL&per_page=100" \
              --jq '.[].number' | wc -l)
            [ "$count" -eq 0 ] && exit 0
            [ "$attempt" -eq 3 ] && break
            sleep 10
          done
          echo "Security gate failed: $count open CodeQL alert(s) on main." >&2
          exit 1

  trivy:
    name: Trivy (deps + secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # upload the Trivy SARIF
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Trivy filesystem scan (vuln + secret)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '1'
          skip-dirs: 'pipeline/node_modules'
      - name: Upload Trivy results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@8272c299f21ca24af15dfe9ac0971ba969e5e0d5 # v3.36.2
        with:
          sarif_file: trivy-results.sarif
