# Dedicated, deny-by-default HTTPS CONNECT proxy for municipal sources that
# drop GitHub-hosted/Azure traffic. This instance is reachable
# only on the Pi's Tailscale address; tailnet ACLs further restrict clients to
# tag:przetargi-ci.

visible_hostname przetargi-egress
http_port 100.114.161.16:3129
pid_filename /run/squid/przetargi-egress.pid

acl tailscale_clients src 100.64.0.0/10
acl local_appliance src 100.114.161.16/32
acl CONNECT method CONNECT
acl TLS_port port 443
acl approved_sources dstdomain .bipraciborz.pl bip.pszczyna.pl bip2.finn.pl
external_acl_type tailscale_ci ttl=60 negative_ttl=10 children-max=4 %SRC /usr/local/libexec/przetargi-check-tailscale-tag
acl authorized_ci external tailscale_ci

# Resolve the destination and reject local, private, documentation, multicast
# and otherwise non-public ranges before considering the hostname allowlist.
# This is the DNS-rebinding/SSRF boundary.
acl prohibited_destinations dst 0.0.0.0/8
acl prohibited_destinations dst 10.0.0.0/8
acl prohibited_destinations dst 100.64.0.0/10
acl prohibited_destinations dst 127.0.0.0/8
acl prohibited_destinations dst 169.254.0.0/16
acl prohibited_destinations dst 172.16.0.0/12
acl prohibited_destinations dst 192.0.0.0/24
acl prohibited_destinations dst 192.0.2.0/24
acl prohibited_destinations dst 192.168.0.0/16
acl prohibited_destinations dst 198.18.0.0/15
acl prohibited_destinations dst 198.51.100.0/24
acl prohibited_destinations dst 203.0.113.0/24
acl prohibited_destinations dst 224.0.0.0/4
acl prohibited_destinations dst 240.0.0.0/4
acl prohibited_destinations dst ::1/128
acl prohibited_destinations dst fc00::/7
acl prohibited_destinations dst fe80::/10
acl prohibited_destinations dst ff00::/8

http_access deny !tailscale_clients
http_access deny !CONNECT
http_access deny !TLS_port
http_access deny prohibited_destinations
http_access allow local_appliance approved_sources
http_access deny !authorized_ci
http_access allow approved_sources
http_access deny all

cache deny all
request_body_max_size 1 MB
connect_timeout 10 seconds
request_timeout 45 seconds
forward_timeout 90 seconds
client_lifetime 5 minutes
shutdown_lifetime 3 seconds

forwarded_for delete
access_log stdio:/var/log/squid/przetargi-egress-access.log
cache_log /var/log/squid/przetargi-egress-cache.log
cache_store_log none
