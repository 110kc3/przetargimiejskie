name: 7. Backfill (manual — full refresh, long timeout)

# One-off "prime the cache" run, triggered MANUALLY (Actions → this workflow →
# Run workflow). Same pipeline as the daily refresh.yml, but:
#   1. every city's job gets a long timeout (350 min) so a COLD cache can't blow
#      the cap on the heavy/OCR cities, and
#   2. the budgeted crawlers (Białystok, Kędzierzyn-Koźle) are UN-bounded via env
#      so they fetch the full archive in one pass.
# Runs the cities in PARALLEL (matrix), so the whole backfill finishes in roughly
# the slowest city's time, not the sum. After it lands once, the daily matrix is
# fast on cache hits and the bounded crawlers only fetch deltas. Re-run if a job
# ever times out — each re-run resumes off the committed cache.
on:
  workflow_dispatch: {}

permissions:
  contents: read

# Share the daily refresh's lock so a backfill and a scheduled run never
# interleave commits on main.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  # Emit the city registry as the matrix input + gate on the parser tests.
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cities: ${{ steps.registry.outputs.cities }}
      blocked_cities: ${{ steps.registry.outputs.blocked_cities }}
      # Cities needing core/render.js (Playwright) — see refresh.yml.
      render_cities: ${{ steps.registry.outputs.render_cities }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Install pipeline deps
        working-directory: pipeline
        run: npm ci
      - name: Run parser tests
        working-directory: pipeline
        run: npm test
      - name: Read city registry
        id: registry
        working-directory: pipeline
        run: node scripts/refresh-matrix.js

  # One job per city, parallel, long timeout, crawlers un-bounded. A failure
  # marks only that city's artifact failed; the others still backfill.
  backfill:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 350     # cold-cache full crawl per city (GitHub max is 360)
    strategy:
      fail-fast: false
      max-parallel: 10       # each job crawls a DIFFERENT BIP; the in-job crawl
                             # throttle is what protects a site (matches refresh.yml)
      matrix:
        city: ${{ fromJSON(needs.setup.outputs.cities) }}
    env:
      # Un-bound the budgeted crawlers for the backfill (daily keeps the caps).
      KK_CRAWL_BUDGET_MS: '300000000'
      KK_MAX_ARTICLES: '100000'
      BIALYSTOK_CRAWL_BUDGET_MS: '300000000'
      BIALYSTOK_MAX_DETAILS: '100000'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install OCR toolchain
        run: |
          # GH-hosted runners preconfigure packages.microsoft.com / azure-cli apt
          # repos that intermittently serve a broken InRelease ("NOSPLIT" / "no
          # longer signed"), making `apt-get update` exit 100 and fail this step —
          # though we only need packages from the standard Ubuntu repos. Drop any
          # Microsoft-repo source first so that recurring flake can't break CI.
          sudo grep -rlZ packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -0r rm -f || true
          sudo apt-get update -qq
          # poppler-utils: pdftotext · tesseract: scanned-PDF OCR · catdoc: legacy .doc
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-pol catdoc

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install pipeline deps
        working-directory: pipeline
        run: npm ci

      - name: Install Playwright Chromium
        if: contains(fromJSON(needs.setup.outputs.render_cities), matrix.city)
        working-directory: pipeline
        run: npx playwright install --with-deps chromium

      - name: Run pipeline for ${{ matrix.city }}
        id: refresh
        working-directory: pipeline
        run: CITY=${{ matrix.city }} npm run refresh

      - name: Sanity-check ${{ matrix.city }} data
        id: sanity
        working-directory: pipeline
        run: node scripts/sanity-check.js ${{ matrix.city }}

      - name: Enrich land geoportal links for ${{ matrix.city }}
        continue-on-error: true
        working-directory: pipeline
        run: CITY=${{ matrix.city }} npm run enrich-land

      - name: Package read-only backfill output
        if: always()
        run: |
          status=failed
          if [ "${{ steps.refresh.outcome }}" = success ] && [ "${{ steps.sanity.outcome }}" = success ]; then
            status=ready
          fi
          node pipeline/scripts/refresh-artifact.js pack-city \
            "${{ matrix.city }}" "$status" refresh-artifact

      - name: Upload backfill output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: refresh-result-${{ matrix.city }}
          path: refresh-artifact/
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [setup, backfill]
    if: ${{ always() && needs.setup.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
      - name: Download backfill outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: 'refresh-result-*'
          path: incoming-city
      - name: Validate and apply backfill outputs
        env:
          EXPECTED_CITIES: ${{ needs.setup.outputs.cities }}
        run: |
          node pipeline/scripts/refresh-artifact.js apply-city \
            incoming-city "$EXPECTED_CITIES" ready-cities.txt publish-paths.txt
          while IFS= read -r city; do
            [ -n "$city" ] || continue
            node pipeline/scripts/sanity-check.js "$city"
          done < ready-cities.txt
      - name: Commit and push validated backfill data
        run: |
          if [ ! -s publish-paths.txt ]; then
            echo "No backfill data changes."
            exit 0
          fi
          git config user.name "zgm-data-bot"
          git config user.email "zgm-data-bot@users.noreply.github.com"
          git add --pathspec-from-file=publish-paths.txt
          if git diff --cached --quiet; then
            echo "No backfill data changes."
            exit 0
          fi
          git commit -m "data: backfill cities $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5 6; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed; retrying ..."
            sleep $(( (RANDOM % 8) + 2 ))
          done
          echo "could not push validated backfill data after 6 attempts" >&2
          exit 1

  # Rebuild data/index.json once every city job has finished.
  index:
    needs: [setup, publish]
    if: ${{ always() && needs.setup.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
      - name: Build data/index.json
        working-directory: pipeline
        run: |
          git pull origin main
          node src/build-index.js
      - name: Commit and push if index changed
        run: |
          git config user.name  "zgm-data-bot"
          git config user.email "zgm-data-bot@users.noreply.github.com"
          git add data/index.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: rebuild index $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main && git push && exit 0
              git rebase --abort 2>/dev/null || true
              echo "push attempt $i failed; retrying ..."
              sleep 3
            done
            echo "could not push index after 5 attempts" >&2
            exit 1
          fi
