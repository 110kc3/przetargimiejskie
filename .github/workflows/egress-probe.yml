name: Temporary no-Tailscale egress probe

on:
  push:
    branches: [fix/ops-security-followup]
    paths:
      - '.github/workflows/egress-probe.yml'

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FETCH_PROXY_URL: ${{ secrets.FETCH_PROXY_URL }}
    steps:
      - name: Existing proxy secret is configured
        if: env.FETCH_PROXY_URL != ''
        run: echo 'FETCH_PROXY_URL is configured; its value is not printed.'
      - name: No proxy secret; probing direct Azure reachability
        if: env.FETCH_PROXY_URL == ''
        run: echo 'FETCH_PROXY_URL is not configured; probes will use direct Azure egress.'

  cities:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        city: [brzeg, raciborz, swietochlowice, walbrzych]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install extraction tools
        run: |
          sudo grep -rlZ packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -0r rm -f || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-pol catdoc

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install locked pipeline dependencies
        working-directory: pipeline
        run: npm ci

      - name: Require a fresh ${{ matrix.city }} refresh
        working-directory: pipeline
        env:
          FETCH_PROXY_URL: ${{ secrets.FETCH_PROXY_URL }}
          FETCH_TIMEOUT_MS: '15000'
        run: |
          before=$(node -p "require('../data/${{ matrix.city }}/meta.json').generated_at")
          CITY=${{ matrix.city }} npm run refresh
          after=$(node -p "require('../data/${{ matrix.city }}/meta.json').generated_at")
          if [ "$before" = "$after" ]; then
            echo '${{ matrix.city }} did not produce a fresh meta timestamp.' >&2
            exit 1
          fi
          node scripts/sanity-check.js ${{ matrix.city }}

  pkp:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install locked pipeline dependencies
        working-directory: pipeline
        run: npm ci

      - name: PKP hosted refresh ${{ matrix.attempt }} of 3
        working-directory: pipeline
        env:
          FETCH_PROXY_URL: ${{ secrets.FETCH_PROXY_URL }}
          FETCH_TIMEOUT_MS: '15000'
        run: PROVIDER=pkp npm run refresh:providers

      - name: Check five active and five result links
        working-directory: pipeline
        env:
          FETCH_PROXY_URL: ${{ secrets.FETCH_PROXY_URL }}
          FETCH_TIMEOUT_MS: '15000'
        run: |
          node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { getText } from './src/core/fetch.js';

          const rows = JSON.parse(await readFile('../data/providers/pkp/listings.json', 'utf8')).listings;
          const active = rows.filter((row) => row.outcome === 'active').slice(0, 5);
          const results = rows.filter((row) => ['sold', 'unsold', 'no_winner'].includes(row.outcome)).slice(0, 5);
          if (active.length < 5 || results.length < 5) {
            throw new Error(`PKP link sample too small: ${active.length} active / ${results.length} result`);
          }

          const normalize = (value) => String(value || '')
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
          const samples = [
            ...active.map((row) => ({ bucket: 'active', row })),
            ...results.map((row) => ({ bucket: 'result', row })),
          ];
          for (const { bucket, row } of samples) {
            const body = await getText(row.detail_url, {
              retries: 1,
              userAgent: 'Mozilla/5.0 (compatible; PrzetargiMiejskie/1.0; +https://przetargimiejskie.pl)',
            });
            const tokens = normalize(row.title).split(/[^a-z0-9]+/).filter((token) => token.length > 4);
            const matches = tokens.filter((token) => normalize(body).includes(token));
            if (body.length < 1000 || matches.length === 0) {
              throw new Error(`${bucket} ${row.external_id}: source page did not match the published row`);
            }
            console.log(`${bucket} ${row.external_id}: ${body.length} bytes; matched ${matches.slice(0, 3).join(', ')}`);
          }
          NODE
